name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The app target sets SWIFT_DEFAULT_ACTOR_ISOLATION = MainActor and
      # SWIFT_APPROACHABLE_CONCURRENCY, which require Xcode 26 / Swift 6.2+.
      # Older Xcode silently ignores those settings and compiles the module
      # under different isolation rules than a local build.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app || sudo xcode-select -s /Applications/Xcode_26.5.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      # Generic destination so CI builds the same universal (arm64 + x86_64)
      # binary that is shipped in the release DMG.
      - name: Build
        run: |
          xcodebuild -project SparkClean.xcodeproj -scheme SparkClean \
            -configuration Release -destination 'generic/platform=macOS' build
